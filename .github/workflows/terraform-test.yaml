name: Terraform tests

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tftest.hcl"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/terraform-test.yaml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tftest.hcl"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/terraform-test.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: miljodir/workflow-templates/.github/workflows/terraform-test.yaml@terraform-test/v0
    with:
      engine: both
      test-directory: tests
      prepare-script: tests/prepare-ci.sh
